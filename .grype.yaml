# Fixed on the 7.2 branch in 7.2.8; the binary match only lists the 8.0 fix.
# https://github.com/valkey-io/valkey/releases/tag/7.2.8
# Grype matches ignore versions exactly, so the rule covers every built 7.2 patch
# release (all at or above 7.2.8). 8.x and 9.x builds are past the 8.0.2 fix.
ignore:
  - vulnerability: CVE-2024-46981
    package:
      name: valkey
      type: binary
