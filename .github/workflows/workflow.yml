name: Build docker image

on:
  pull_request:
  push:
    branches:
      - main

    tags:
      - '*'
      - '!*-r[0-9]*'

env:
  VALKEY90: '9.0.6'
  VALKEY81: '8.1.10'
  VALKEY80: '8.0.11'
  VALKEY72: '7.2.14'

jobs:
  setup:
    runs-on: ubuntu-latest
    outputs:
      valkey-versions: ${{ steps.set-matrix.outputs.valkey-versions }}
    steps:
      - id: set-matrix
        run: |
          cat << 'EOF' > versions.json
          [
            {"key": "valkey90", "version": "${{ env.VALKEY90 }}", "latest": "1", "latest_major": "1"},
            {"key": "valkey81", "version": "${{ env.VALKEY81 }}", "latest": "", "latest_major": "1"},
            {"key": "valkey80", "version": "${{ env.VALKEY80 }}", "latest": "", "latest_major": ""},
            {"key": "valkey72", "version": "${{ env.VALKEY72 }}", "latest": "", "latest_major": "1"}
          ]
          EOF
          echo "valkey-versions=$(cat versions.json | jq -c .)" >> $GITHUB_OUTPUT

  build:
    needs: setup
    strategy:
      fail-fast: false
      matrix:
        valkey: ${{ fromJson(needs.setup.outputs.valkey-versions) }}
        arch:
          - amd64
          - arm64
        include:
          - arch: amd64
            runner: ubuntu-24.04
          - arch: arm64
            runner: ubuntu-24.04-arm
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v5
      - uses: docker/login-action@v3
        if: github.event_name == 'push'
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}
      - name: Build and test
        id: build-image
        env:
          VALKEY_VER: ${{ matrix.valkey.version }}
          ARCH: ${{ matrix.arch }}
        run: |
          make
          make test
          echo "image=$(make --no-print-directory -s image-ref)" >> "$GITHUB_OUTPUT"
      - name: Scan image
        uses: ./.github/actions/grype
        with:
          image: docker:${{ steps.build-image.outputs.image }}
      - name: Push scanned architecture image
        if: github.event_name == 'push'
        env:
          VALKEY_VER: ${{ matrix.valkey.version }}
          ARCH: ${{ matrix.arch }}
        run: make push

  push:
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    needs:
      - setup
      - build
    strategy:
      matrix:
        valkey: ${{ fromJson(needs.setup.outputs.valkey-versions) }}
    steps:
      - uses: actions/checkout@v5
      - uses: docker/login-action@v3
        if: github.event_name == 'push'
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}
      - uses: ./.github/actions
        with:
          version: ${{ matrix.valkey.version }}
          latest: ${{ matrix.valkey.latest }}
          latest_major: ${{ matrix.valkey.latest_major }}
  image-revision-aliases:
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/r')
    needs: [ push ]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    concurrency:
      group: image-revision-aliases-${{ github.ref }}
      cancel-in-progress: false
    steps:
      - uses: wodby/images/.github/actions/image-revision-aliases@6a3956567002e48847338be97b4d955ee40ae7cb
        with:
          docker_username: ${{ secrets.DOCKER_USERNAME }}
          docker_password: ${{ secrets.DOCKER_PASSWORD }}
